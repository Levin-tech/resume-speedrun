<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>简历速通</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div id="app">
      <h1>简历速通</h1>
      <label class="profile-row" for="profile-select">
        当前简历
        <select id="profile-select" data-testid="profile-select"></select>
      </label>
      <button id="fill-btn" class="primary" data-testid="fill-btn" disabled>开始填写</button>
      <button id="undo-btn" data-testid="undo-btn" hidden>撤销本次填写</button>
      <p id="fill-summary" class="fill-summary" data-testid="fill-summary" hidden></p>
      <p class="placeholder">填完不会自动提交，请在页面上检查后自己点提交。</p>
      <button id="enable-btn" data-testid="enable-btn" hidden>在本页启用</button>
      <hr />
      <div class="diag-section">
        <button id="scan-diag-btn" data-testid="scan-diag-btn">扫描诊断</button>
        <button id="clear-diag-btn" data-testid="clear-diag-btn" hidden>清除浮层</button>
        <button id="export-diag-btn" data-testid="export-diag-btn" hidden>导出诊断报告</button>
      </div>
      <p id="status-text" class="status-text" data-testid="status-text"></p>
      <p id="diag-summary" class="diag-summary" hidden></p>
      <hr />
      <button id="open-options-btn" data-testid="open-options-btn">
        打开信息库
      </button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
